<html lang="en">
<head>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f4ff;
      --surface: #ffffff;
      --surface2: #e8edf8;
      --border: rgba(10,31,92,0.1);
      --border2: rgba(10,31,92,0.2);
      --text: #0a1f5c;
      --muted: #5a6a8a;
      --accent: #1a4a9c;
      --accent2: #b22234;
      --danger: #b22234;
      --pill-bg: rgba(26,74,156,0.1);
      --pill-text: #1a4a9c;
      --radius: 12px;
      --radius-sm: 8px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      line-height: 1.5;
    }

    /* ── Brand Bar ── */
    #brand-bar {
      background: #0a1f5c;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    #brand-bar .brand-text { display: flex; flex-direction: column; line-height: 1.2; }
    #brand-bar .brand-name { color: #f0f4ff; font-family: Georgia, serif; font-size: 14px; font-weight: 700; letter-spacing: 1px; }
    #brand-bar .brand-tag { color: #b22234; font-family: Georgia, serif; font-size: 9px; letter-spacing: 3px; }

    /* ── Search Section ── */
    #search-section {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 20px 0;
    }

    .search-wrap {
      position: relative;
      margin-bottom: 8px;
    }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      pointer-events: none;
    }
    #search-input {
      width: 100%;
      padding: 13px 16px 13px 42px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: var(--text);
      background: var(--surface);
      border: 1.5px solid var(--border2);
      border-radius: var(--radius);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(26,74,156,0.1);
    }
    #search-input::placeholder { color: var(--muted); }

    /* ── Search Results Dropdown ── */
    #search-results {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(10,31,92,0.12);
      overflow: hidden;
      display: none;
      max-height: 320px;
      overflow-y: auto;
    }
    .result-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.1s;
    }
    .result-item:last-child { border-bottom: none; }
    .result-item:hover { background: var(--surface2); }
    .result-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0a1f5c 0%, #b22234 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600; color: #fff;
      flex-shrink: 0;
    }
    .result-info { flex: 1; min-width: 0; }
    .result-name { font-size: 13px; font-weight: 500; color: var(--text); }
    .result-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .result-empty {
      padding: 20px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      font-style: italic;
    }
    .result-searching {
      padding: 14px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .mini-spinner {
      width: 14px; height: 14px;
      border: 2px solid var(--border2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Loading & Error States ── */
    #loading-state {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      gap: 16px;
      color: var(--muted);
    }
    .spinner {
      width: 36px; height: 36px;
      border: 2px solid var(--border2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    #error-state {
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
      gap: 16px;
      color: var(--muted);
    }
    #error-state .err-icon { font-size: 32px; }
    #error-state p { font-size: 13px; max-width: 300px; text-align: center; }

    /* ── Empty State ── */
    #empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
      gap: 12px;
      color: var(--muted);
    }
    #empty-state .empty-icon { font-size: 40px; opacity: 0.4; }
    #empty-state p { font-size: 13px; }

    /* ── App / Profile ── */
    #app { display: none; max-width: 960px; margin: 0 auto; padding: 24px 20px 60px; }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 28px;
    }
    .avatar {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0a1f5c 0%, #b22234 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: 600; color: #fff;
      flex-shrink: 0;
    }
    .header-info { flex: 1; }
    .header-name { font-size: 24px; font-weight: 600; letter-spacing: -0.4px; color: var(--text); margin-bottom: 4px; }
    .header-sub { color: var(--muted); font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
    .header-sub span { display: flex; align-items: center; gap: 5px; }
    .header-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .badge { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 20px; background: var(--pill-bg); color: var(--pill-text); }
    .badge.green { background: rgba(61,214,140,0.12); color: #1a9c4a; }
    .badge.red { background: rgba(247,95,95,0.12); color: #c0392b; }
    .header-actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; flex-shrink: 0; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: opacity 0.15s; text-decoration: none; }
    .btn:hover { opacity: 0.8; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }

    /* ── Grid ── */
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-wide { grid-column: 1 / -1; }
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      .header { flex-direction: column; }
      .header-actions { flex-direction: row; }
    }

    /* ── Cards ── */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .card-title { font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; }

    /* ── Field Rows ── */
    .field-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid var(--border); gap: 12px; }
    .field-row:last-child { border-bottom: none; padding-bottom: 0; }
    .field-row:first-child { padding-top: 0; }
    .field-label { color: var(--muted); font-size: 12px; min-width: 110px; flex-shrink: 0; padding-top: 1px; }
    .field-value { color: var(--text); font-size: 13px; text-align: right; word-break: break-all; }
    .field-value a { color: var(--accent); text-decoration: none; }
    .field-value a:hover { text-decoration: underline; }
    .empty { color: var(--muted); font-style: italic; font-size: 12px; }

    /* ── Inline Editing ── */
    .field-value[data-editable] { cursor: pointer; border-radius: 4px; padding: 1px 4px; margin: -1px -4px; transition: background 0.15s; }
    .field-value[data-editable]:hover { background: rgba(26,74,156,0.08); }
    .field-value[data-editable]:hover::after { content: ' ✏'; font-size: 10px; opacity: 0.4; }
    .edit-wrap { display: flex; align-items: center; gap: 4px; justify-content: flex-end; }
    .edit-input { font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text); background: var(--surface2); border: 1.5px solid var(--accent); border-radius: 6px; padding: 3px 8px; outline: none; text-align: right; min-width: 120px; max-width: 200px; }
    .edit-select { font-family: 'DM Sans', sans-serif; font-size: 13px; color: var(--text); background: var(--surface2); border: 1.5px solid var(--accent); border-radius: 6px; padding: 3px 8px; outline: none; max-width: 200px; }
    .edit-btn { background: none; border: none; cursor: pointer; font-size: 14px; padding: 2px 4px; border-radius: 4px; line-height: 1; }
    .edit-btn:hover { background: var(--surface2); }
    .save-indicator { font-size: 11px; color: #1a9c4a; margin-left: 4px; }
    .saving-indicator { font-size: 11px; color: var(--muted); margin-left: 4px; }

    /* ── Tags ── */
    .tags-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { font-size: 11px; padding: 4px 10px; border-radius: 20px; background: var(--surface2); color: var(--muted); border: 1px solid var(--border2); }

    /* ── Opportunities ── */
    .opp-item { padding: 12px; background: var(--surface2); border-radius: var(--radius-sm); margin-bottom: 8px; border: 1px solid var(--border); }
    .opp-item:last-child { margin-bottom: 0; }
    .opp-name { font-weight: 500; font-size: 13px; margin-bottom: 4px; }
    .opp-meta { display: flex; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
    .opp-value { color: var(--accent2); font-weight: 500; }
    .opp-stage { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: rgba(79,142,247,0.12); color: var(--pill-text); }

    /* ── Address Autocomplete ── */
    .address-edit-wrap { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
    .address-input {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--text);
      background: var(--surface2);
      border: 1.5px solid var(--accent);
      border-radius: 6px;
      padding: 5px 10px;
      outline: none;
      width: 220px;
    }
    .address-hint { font-size: 11px; color: var(--muted); font-style: italic; }
    .pac-container { font-family: 'DM Sans', sans-serif; font-size: 13px; z-index: 9999; }

        /* ── Contact List ── */
    #contact-list-section {
      max-width: 960px;
      margin: 0 auto;
      padding: 12px 20px 0;
    }
    #contact-list {
      background: var(--surface);
      border: 1px solid var(--border2);
      border-radius: var(--radius);
      max-height: 340px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
    }
    @media (max-width: 700px) {
      #contact-list { grid-template-columns: repeat(2, 1fr); }
    }
    .contact-list-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      transition: background 0.1s;
    }
    .contact-list-item:hover { background: var(--surface2); }
    .contact-list-item.active { background: var(--pill-bg); }
    .contact-list-avatar {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0a1f5c 0%, #b22234 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 600; color: #fff;
      flex-shrink: 0;
    }
    .contact-list-name { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .contact-list-loading {
      grid-column: 1 / -1;
      padding: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .contact-list-count {
      font-size: 11px;
      color: var(--muted);
      padding: 6px 14px;
      border-top: 1px solid var(--border);
      text-align: right;
    }

    /* ── Activity ── */
    .activity-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
    .activity-item:last-child { border-bottom: none; }
    .activity-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
    .activity-icon.sms { background: rgba(26,74,156,0.1); }
    .activity-icon.email { background: rgba(178,34,52,0.1); }
    .activity-icon.call { background: rgba(26,74,156,0.08); }
    .activity-icon.note { background: rgba(178,34,52,0.08); }
    .activity-icon.other { background: var(--surface2); }
    .activity-body { flex: 1; min-width: 0; }
    .activity-type { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 2px; }
    .activity-text { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .activity-time { font-size: 11px; color: var(--muted); flex-shrink: 0; padding-top: 2px; }
  </style>
</head>
<body>

<div id="brand-bar">
  <div class="brand-text">
    <span class="brand-name">FEDERAL RETIREMENT ADVISORS</span>
    <span class="brand-tag">GUIDANCE FOR FEDERAL CAREERS WELL SPENT</span>
  </div>
</div>

<!-- Search -->
<div id="search-section">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search-input" placeholder="Search contacts by name, email, or phone…" autocomplete="off" />
  </div>

</div>

<!-- Contact List -->
<div id="contact-list-section">
  <div id="contact-list">
    <div class="contact-list-loading"><div class="mini-spinner"></div> Loading contacts…</div>
  </div>
  <div class="contact-list-count" id="contact-list-count"></div>
</div>

<!-- States -->
<div id="empty-state">
  <div class="empty-icon">👤</div>
  <p>Select a contact from the list above to view their profile</p>
</div>

<div id="loading-state">
  <div class="spinner"></div>
  <span>Loading contact…</span>
</div>

<div id="error-state">
  <div class="err-icon">⚠️</div>
  <strong id="err-title">Could not load contact</strong>
  <p id="err-msg"></p>
</div>

<!-- Profile -->
<div id="app"></div>

<script>
// ── Access Control ──
const VALID_TOKEN = 'FRA2026secure';
const urlToken = new URLSearchParams(window.location.search).get('token');
if (urlToken !== VALID_TOKEN) {
  document.body.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#0a1f5c;font-family:'DM Sans',sans-serif;">
      <div style="color:#b22234;font-size:48px;margin-bottom:16px;">⛔</div>
      <div style="color:#f0f4ff;font-size:18px;font-weight:600;margin-bottom:8px;">Access Denied</div>
      <div style="color:#5a6a8a;font-size:13px;">This page must be opened from the GHL menu.</div>
    </div>`;
  throw new Error('Access denied');
}

const LOCATION_ID = '7ZVXNPvaTTHCO2wcpdnk';
let currentContactId = null;
let searchTimeout = null;
let allContacts = [];

// ── Search Logic ──
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
const contactList = document.getElementById('contact-list');
const contactListCount = document.getElementById('contact-list-count');

// Load all contacts on page load
async function loadAllContacts() {
  try {
    const res = await fetch('/api/contacts');
    const data = await res.json();
    allContacts = (data.contacts || []).sort((a, b) => {
      const lastA = (a.lastName || a.firstName || '').toLowerCase();
      const lastB = (b.lastName || b.firstName || '').toLowerCase();
      return lastA.localeCompare(lastB);
    });
    renderContactList(allContacts);
  } catch(e) {
    contactList.innerHTML = '<div class="contact-list-loading">Could not load contacts</div>';
  }
}

function renderContactList(contacts) {
  if (!contacts.length) {
    contactList.innerHTML = '<div class="contact-list-loading">No contacts found</div>';
    contactListCount.textContent = '';
    return;
  }
  contactList.innerHTML = contacts.map(c => {
    const fullName = [c.firstName, c.lastName].filter(Boolean).join(' ') || 'Unknown';
    const displayName = c.lastName
      ? `${c.lastName}, ${c.firstName || ''}`.trim().replace(/,$/, '')
      : (c.firstName || 'Unknown');
    return `<div class="contact-list-item" onclick="selectContactFromList('${c.id}', this)" title="${fullName}">
      <div class="contact-list-avatar">${initials(fullName)}</div>
      <div class="contact-list-name">${displayName}</div>
    </div>`;
  }).join('');
  contactListCount.textContent = `${contacts.length} contact${contacts.length !== 1 ? 's' : ''}`;
}

function selectContactFromList(id, el) {
  document.querySelectorAll('.contact-list-item').forEach(i => i.classList.remove('active'));
  if (el) el.classList.add('active');
  loadContact(id);
}

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimeout);
  const q = searchInput.value.trim().toLowerCase();

  // Filter the loaded list
  if (q.length === 0) {
    renderContactList(allContacts);
    return;
  }

  const filtered = allContacts.filter(c => {
    const name = [c.firstName, c.lastName].filter(Boolean).join(' ').toLowerCase();
    return name.includes(q);
  });

  if (filtered.length > 0) {
    renderContactList(filtered);
  } else {
    // Fall back to API search if nothing in local list
    contactList.innerHTML = '<div class="contact-list-loading"><div class="mini-spinner"></div> Searching…</div>';
    searchTimeout = setTimeout(() => doSearch(q), 350);
  }
});

async function doSearch(q) {
  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    const contacts = data.contacts || [];
    renderContactList(contacts);
  } catch(e) {
    contactList.innerHTML = '<div class="contact-list-loading">Search failed. Please try again.</div>';
  }
}

async function loadContact(id) {
  if (searchResults) searchResults.style.display = 'none';
  currentContactId = id;
  showState('loading');
  try {
    const data = await fetch(`/api/contact?contactId=${id}`).then(r => r.json());
    const contact = data.contact?.contact || data.contact || data;
    const opps = data.opps?.opportunities || data.opps?.data || [];
    renderApp(contact, opps);
    loadActivity(id);
    showState('app');
  } catch(err) {
    showError('Could not load contact', err.message);
  }
}

function showState(state) {
  document.getElementById('empty-state').style.display = state === 'empty' ? 'flex' : 'none';
  document.getElementById('loading-state').style.display = state === 'loading' ? 'flex' : 'none';
  document.getElementById('error-state').style.display = state === 'error' ? 'flex' : 'none';
  document.getElementById('app').style.display = state === 'app' ? 'block' : 'none';
}

function showError(title, msg) {
  document.getElementById('err-title').textContent = title;
  document.getElementById('err-msg').textContent = msg || '';
  showState('error');
}

// ── Helpers ──
function initials(name) {
  if (!name) return '?';
  return name.split(' ').filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}
function fmtPhone(p) {
  if (!p) return null;
  const d = p.replace(/\D/g, '');
  if (d.length === 10) return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
  if (d.length === 11) return `+${d[0]} (${d.slice(1,4)}) ${d.slice(4,7)}-${d.slice(7)}`;
  return p;
}
function fmtDate(s) {
  if (!s) return null;
  try { return new Date(s).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' }); }
  catch { return s; }
}
function fmtMoney(n) {
  if (n === null || n === undefined) return null;
  return new Intl.NumberFormat('en-US', { style:'currency', currency:'USD', maximumFractionDigits:0 }).format(n);
}

function fieldRow(label, value, cls='', editKey=null, editType='text', editOptions=null) {
  const display = (value !== null && value !== undefined && value !== '') ? value : null;
  const editAttr = editKey ? `data-editable="true" data-key="${editKey}" data-type="${editType}" data-options='${JSON.stringify(editOptions||[])}' onclick="startEdit(this)"` : '';
  if (display === null) {
    return `<div class="field-row"><span class="field-label">${label}</span><span class="field-value empty" ${editAttr}>—</span></div>`;
  }
  return `<div class="field-row"><span class="field-label">${label}</span><span class="field-value ${cls}" ${editAttr}>${display}</span></div>`;
}

function cfRowEditable(fieldDef, customFields) {
  const f = customFields.find(c => c.id === fieldDef.id);
  const val = (f && f.value !== null && f.value !== undefined && f.value !== '') ? f.value : null;
  const displayVal = val !== null ? (Array.isArray(val) ? val.join(', ') : String(val)) : null;
  const editType = fieldDef.options ? 'select' : (fieldDef.date ? 'date' : 'text');
  const editAttr = `data-editable="true" data-key="${fieldDef.id}" data-keytype="custom" data-type="${editType}" data-options='${JSON.stringify(fieldDef.options||[])}' onclick="startEdit(this)"`;
  if (!displayVal) {
    return `<div class="field-row"><span class="field-label">${fieldDef.label}</span><span class="field-value empty" ${editAttr}>—</span></div>`;
  }
  return `<div class="field-row"><span class="field-label">${fieldDef.label}</span><span class="field-value" ${editAttr}>${displayVal}</span></div>`;
}

async function startAddressEdit(el) {
  if (el.querySelector('input, gmp-place-autocomplete')) return;
  const currentVal = (el.innerText === '—') ? '' : el.innerText.trim();
  const originalHTML = el.innerHTML;

  // Load Places library (new API)
  const { PlaceAutocompleteElement } = await google.maps.importLibrary("places");

  // Create the new autocomplete element
  const autocompleteEl = new PlaceAutocompleteElement({
    types: ['address'],
    componentRestrictions: { country: 'us' }
  });
  autocompleteEl.style.cssText = 'width:220px;font-size:13px;';
  if (currentVal) autocompleteEl.value = currentVal;

  const hint = document.createElement('div');
  hint.className = 'address-hint';
  hint.textContent = 'Select from suggestions to fill all address fields';

  const btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex;gap:4px;justify-content:flex-end';

  const saveBtn = document.createElement('button');
  saveBtn.className = 'edit-btn'; saveBtn.textContent = '✓'; saveBtn.title = 'Save as typed';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'edit-btn'; cancelBtn.textContent = '✕'; cancelBtn.title = 'Cancel';
  btnRow.appendChild(saveBtn); btnRow.appendChild(cancelBtn);

  const wrap = document.createElement('div');
  wrap.className = 'address-edit-wrap';
  wrap.appendChild(autocompleteEl); wrap.appendChild(hint); wrap.appendChild(btnRow);

  el.innerHTML = '';
  el.appendChild(wrap);

  // Listen for place selection - try both event names
  const handlePlaceSelect = async (event) => {
    try {
      console.log('Place event fired:', event.type);
      // Parse address from event.mh.ds - data is nested inside first value
      const ds = event.mh?.ds;
      const dsInner = Object.values(ds || {})[0];
      const fullAddress = (() => {
        const addr = Array.isArray(dsInner) ? dsInner[2] : null;
        if (Array.isArray(addr)) return addr[0];
        if (typeof addr === 'string') return addr;
        return autocompleteEl.value;
      })();
      let placeId = null;
      if (Array.isArray(dsInner)) {
        if (typeof dsInner[1] === 'string' && dsInner[1].startsWith('ChIJ')) placeId = dsInner[1];
        else if (typeof dsInner[0] === 'string' && dsInner[0].startsWith('places/')) placeId = dsInner[0].replace('places/', '');
      }
      console.log('Full address:', fullAddress, 'Place ID:', placeId);

      if (placeId) {
        const { Place } = await google.maps.importLibrary("places");
        const place = new Place({ id: placeId });
        await place.fetchFields({ fields: ['addressComponents'] });
        let street_number = '', route = '', city = '', state = '', postal = '';
        for (const comp of (place.addressComponents || [])) {
          const types = comp.types || [];
          if (types.includes('street_number')) street_number = comp.longText || '';
          if (types.includes('route')) route = comp.longText || '';
          if (types.includes('locality')) city = comp.longText || '';
          if (types.includes('administrative_area_level_1')) state = comp.shortText || '';
          if (types.includes('postal_code')) postal = comp.longText || '';
        }
        const fullStreet = [street_number, route].filter(Boolean).join(' ');
        console.log('Address parsed:', { fullStreet, city, state, postal });
        saveAddressFields(el, fullStreet, city, state, postal, originalHTML);
      } else {
        // Fallback: parse the formatted address string
        const parts = fullAddress.split(',').map(s => s.trim());
        const street = parts[0] || '';
        const cityPart = parts[1] || '';
        const stateZip = parts[2] || '';
        const stateMatch = stateZip.match(/^([A-Z]{2})\s*(\d{5})?/);
        const state = stateMatch ? stateMatch[1] : '';
        const postal = stateMatch ? (stateMatch[2] || '') : '';
        saveAddressFields(el, street, cityPart, state, postal, originalHTML);
      }
    } catch(err) {
      console.error('Place select error:', err);
    }
  };
  autocompleteEl.addEventListener('gmp-placeselect', handlePlaceSelect);
  autocompleteEl.addEventListener('gmp-select', handlePlaceSelect);
  autocompleteEl.addEventListener('place_changed', handlePlaceSelect);

  cancelBtn.onclick = (e) => { e.stopPropagation(); el.innerHTML = originalHTML; };
  saveBtn.onclick = (e) => {
    e.stopPropagation();
    const typedVal = autocompleteEl.value || '';
    saveField(el, 'address1', null, typedVal, originalHTML);
  };
}

async function saveAddressFields(el, address1, city, state, postalCode, originalHTML) {
  el.innerHTML = `<span class="saving-indicator">Saving…</span>`;
  try {
    const res = await fetch(`/api/update?contactId=${currentContactId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ address1, city, state, postalCode })
    });
    if (!res.ok) throw new Error('Save failed');

    // Update address field display
    el.textContent = address1 || '—';
    if (!address1) el.classList.add('empty');
    else el.classList.remove('empty');

    // Flash saved indicator
    const ind = document.createElement('span');
    ind.className = 'save-indicator';
    ind.textContent = '✓ Saved';
    el.appendChild(ind);
    setTimeout(() => ind.remove(), 2000);

    // Update city, state, postal fields in the UI without triggering edit mode
    updateFieldDisplay('city', city);
    updateFieldDisplay('state', state);
    updateFieldDisplay('postalCode', postalCode);
  } catch(err) {
    el.innerHTML = originalHTML;
    alert('Failed to save address. Please try again.');
  }
}

function updateFieldDisplay(key, value) {

  3: { label: 'Email', icon: '✉️', cls: 'email' },

function renderActivity(messages) {
  if (!messages || messages.length === 0) return '<span class="empty">No activity yet</span>';
  return messages.map(m => {
    const typeInfo = MSG_TYPE_MAP[m.messageType] || { label: 'Activity', icon: '🔔', cls: 'other' };
    const direction = m.direction === 'inbound' ? '← ' : '→ ';
    const body = m.body || m.subject || (m.attachments?.length ? `${m.attachments.length} attachment(s)` : '—');
    const truncated = body.length > 60 ? body.substring(0, 60) + '…' : body;
    const time = m.dateAdded ? new Date(m.dateAdded).toLocaleDateString('en-US', {
      month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit'
    }) : '';
    return `<div class="activity-item">
      <div class="activity-icon ${typeInfo.cls}">${typeInfo.icon}</div>
      <div class="activity-body">
        <div class="activity-type">${direction}${typeInfo.label}</div>
        <div class="activity-text">${truncated}</div>
      </div>
      <div class="activity-time">${time}</div>
    </div>`;
  }).join('');
}

async function loadActivity(contactId) {
  try {
    const data = await fetch(`/api/activity?contactId=${contactId}`).then(r => r.json());
    const el = document.getElementById('activity-feed');
    if (el) el.innerHTML = renderActivity(data.messages);
  } catch(e) {
    const el = document.getElementById('activity-feed');
    if (el) el.innerHTML = '<span class="empty">Could not load activity</span>';
  }
}

// ── Inline Edit ──
function startEdit(el) {
  if (el.querySelector('input, select')) return;
  const key = el.dataset.key;
  const keytype = el.dataset.keytype;
  const type = el.dataset.type;
  const options = JSON.parse(el.dataset.options || '[]');
  const currentVal = (el.innerText === '—') ? '' : el.innerText.trim();

  let input;
  if (type === 'select' && options.length) {
    input = document.createElement('select');
    input.className = 'edit-select';
    const blank = document.createElement('option');
    blank.value = ''; blank.textContent = '-- select --';
    input.appendChild(blank);
    options.forEach(opt => {
      const o = document.createElement('option');
      o.value = opt; o.textContent = opt;
      if (opt === currentVal) o.selected = true;
      input.appendChild(o);
    });
  } else {
    input = document.createElement('input');
    input.className = 'edit-input';
    input.type = type === 'date' ? 'date' : 'text';
    input.value = currentVal;
  }

  const saveBtn = document.createElement('button');
  saveBtn.className = 'edit-btn'; saveBtn.textContent = '✓'; saveBtn.title = 'Save';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'edit-btn'; cancelBtn.textContent = '✕'; cancelBtn.title = 'Cancel';
  const wrap = document.createElement('div');
  wrap.className = 'edit-wrap';
  wrap.appendChild(input); wrap.appendChild(saveBtn); wrap.appendChild(cancelBtn);

  const originalHTML = el.innerHTML;
  el.innerHTML = '';
  el.appendChild(wrap);
  input.focus();

  cancelBtn.onclick = (e) => { e.stopPropagation(); el.innerHTML = originalHTML; };
  saveBtn.onclick = (e) => { e.stopPropagation(); saveField(el, key, keytype, input.value, originalHTML); };
  input.onkeydown = (e) => { if (e.key === 'Enter') saveBtn.click(); if (e.key === 'Escape') cancelBtn.click(); };
}

async function saveField(el, key, keytype, value, originalHTML) {
  el.innerHTML = `<span class="saving-indicator">Saving…</span>`;
  try {
    const body = keytype === 'custom'
      ? { customFields: [{ id: key, field_value: value }] }
      : { [key]: value };
    const res = await fetch(`/api/update?contactId=${currentContactId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error('Save failed');
    el.innerHTML = value || '<span class="empty">—</span>';
    el.insertAdjacentHTML('beforeend', '<span class="save-indicator">✓ Saved</span>');
    setTimeout(() => { const i = el.querySelector('.save-indicator'); if (i) i.remove(); }, 2000);
  } catch(err) {
    el.innerHTML = originalHTML;
    alert('Failed to save. Please try again.');
  }
}
